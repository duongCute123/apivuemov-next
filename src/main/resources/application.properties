# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/vuemov}
spring.data.mongodb.database=${MONGODB_DATABASE:vuemov}

# JWT Configuration
jwt.secret=${JWT_SECRET:VuemovSecretKey2024ForJWTTokenGenerationAndValidation123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.vuemov=DEBUG
logging.level.org.springframework.security=DEBUG
