database:
  name: vuemov-db
  plan: free

services:
  - type: web
    name: vuemov-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/vuemov-backend-1.0.0.jar
    plan: free
    envVars:
      - key: MONGODB_URI
        fromDatabase:
          name: vuemov-db
          property: MONGODB_URI
      - key: MONGODB_DATABASE
        value: vuemov
      - key: JWT_SECRET
        value: VuemovSecretKey2024ForJWTTokenGenerationAndValidation123456789
      - key: JWT_EXPIRATION
        value: "86400000"
